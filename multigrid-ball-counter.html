<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times Square NYE 2026 - Multigrid</title>
    <style>
        body {
            margin: 0;
            background: url('img/NYE-Fondo2png') no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 15px;
        }

        .parent {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, auto);
            /* Cambiado a auto para permitir alturas ajustables por aspect-ratio */
            gap: 10px;
            width: 100%;
            max-width: 1200px;
            /* Limita el ancho máximo para pantallas grandes */
        }

        .div1 {
            grid-column: span 2 / span 2;
            grid-row: span 2 / span 2;
            position: relative;
            border: 4px solid #0000ff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 12px #0000ff;
            aspect-ratio: 16 / 9;
            /* Ratio 16:9 */
        }

        .div2 {
            grid-column-start: 3;
            position: relative;
            border: 4px solid #0000ff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 12px #0000ff;
            aspect-ratio: 16 / 9;
            /* Ratio 16:9 */
        }

        .div3 {
            grid-column-start: 3;
            grid-row-start: 2;
            position: relative;
            border: 4px solid #0000ff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 12px #0000ff;
            aspect-ratio: 16 / 9;
            /* Ratio 16:9 */
        }

        .div4 {
            grid-row-start: 3;
            position: relative;
            border: 4px solid #0000ff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 12px #0000ff;
            aspect-ratio: 16 / 9;
            /* Ratio 16:9 */
        }

        .div5 {
            grid-row-start: 3;
            position: relative;
            border: 4px solid #0000ff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 12px #0000ff;
            aspect-ratio: 16 / 9;
            /* Ratio 16:9 */
        }

        .div6 {
            grid-row-start: 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe,
        img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .label {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 255, 0.9);
            padding: 5px 10px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 5px;
            color: white;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Arial Black', Arial, sans-serif;
            box-shadow: 0 0 8px #0000ff;
            user-select: none;
            white-space: nowrap;
        }

        .logo-container {
            text-align: center;
            font-family: 'Arial Black', Arial, sans-serif;
            font-size: 34px;
            color: #fffc00;
            text-shadow:
                0 0 10px #fffc00,
                0 0 20px #fffc00,
                0 0 30px #bbff00,
                0 0 40px #bbff00,
                0 0 50px #aaff00,
                0 0 60px #aaff00;
            letter-spacing: 6px;
            background-color: rgba(0, 0, 255, 0.75);
            padding: 15px 30px;
            border-radius: 15px;
            width: fit-content;
            user-select: none;
        }

        .logo-container span {
            display: block;
            font-size: 16px;
            color: #ccc;
            text-shadow: none;
            margin-top: 6px;
            letter-spacing: normal;
        }

        .neon-purple {
            color: #9999ff;
            text-shadow:
                0 0 7px #9999ff,
                0 0 15px #5c5cff,
                0 0 25px #5c5cff,
                0 0 35px #0000ff;
        }

        #video-fondo {
            /** Posicionamiento **/
            position: fixed;
            /* Fija el video a la ventana */
            top: 0;
            left: 0;

            /** Dimensiones **/
            width: 100vw;
            /* 100% del ancho de la ventana */
            height: 100vh;
            /* 100% del alto de la ventana */

            /** Asegura que cubra todo, incluso si se recorta **/
            object-fit: cover;

            /** Pone el video detrás de otro contenido **/
            z-index: -1;
        }

        /* Media queries para responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                gap: 10px;
            }

            .parent {
                grid-template-columns: 1fr;
                /* Una sola columna en móviles */
                grid-template-rows: auto;
                /* Altura automática */
                gap: 10px;
            }

            .div1,
            .div2,
            .div3,
            .div4,
            .div5,
            .div6 {
                grid-column: span 1;
                grid-row: span 1;
            }

            .logo-container {
                font-size: 28px;
                /* Reduce el tamaño de fuente en móviles */
                letter-spacing: 3px;
                /* Reduce el espaciado */
                padding: 10px 20px;
            }

            .logo-container span {
                font-size: 14px;
            }

            .label {
                font-size: 12px;
                /* Reduce el tamaño de la etiqueta */
                padding: 4px 8px;
            }
        }

        @media (max-width: 480px) {
            .logo-container {
                font-size: 24px;
                letter-spacing: 2px;
                padding: 8px 15px;
            }

            .logo-container span {
                font-size: 12px;
            }

            .label {
                font-size: 10px;
                padding: 3px 6px;
            }
        }
    </style>
</head>
