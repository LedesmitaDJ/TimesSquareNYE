    <style>
        body {
            margin: 0;
            background: #121212 url('img/NYE-Fondo2') no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 15px;
        }

        .parent {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
        }

        .div1 {
            grid-column: span 2 / span 2;
            grid-row: span 2 / span 2;
            position: relative;
            border: 4px solid #0000ff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 12px #0000ff;
        }

        .div2 {
            grid-column-start: 3;
            position: relative;
            border: 4px solid #0000ff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 12px #0000ff;
        }

        .div3 {
            grid-column-start: 3;
            grid-row-start: 2;
            position: relative;
            border: 4px solid #0000ff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 12px #0000ff;
        }

        .div4 {
            grid-row-start: 3;
            position: relative;
            border: 4px solid #0000ff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 12px #0000ff;
        }

        .div5 {
            grid-row-start: 3;
            position: relative;
            border: 4px solid #0000ff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 12px #0000ff;
        }

        .div6 {
            grid-row-start: 3;
        }

        iframe,
        img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .label {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 255, 0.9);
            padding: 5px 10px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 5px;
            color: white;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Arial Black', Arial, sans-serif;
            box-shadow: 0 0 8px #0000ff;
            user-select: none;
            white-space: nowrap;
        }

        .logo-container {
            margin-top: 20px;
            text-align: center;
            font-family: 'Arial Black', Arial, sans-serif;
            font-size: 42px;
            color: #fffc00;
            text-shadow:
                0 0 10px #fffc00,
                0 0 20px #fffc00,
                0 0 30px #bbff00,
                0 0 40px #bbff00,
                0 0 50px #aaff00,
                0 0 60px #aaff00;
            letter-spacing: 6px;
            background-color: rgba(0, 0, 255, 0.75);
            padding: 15px 30px;
            border-radius: 15px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            user-select: none;
        }

        .logo-container span {
            display: block;
            font-size: 16px;
            color: #ccc;
            text-shadow: none;
            margin-top: 6px;
            letter-spacing: normal;
        }

        .neon-purple {
            color: #9999ff;
            text-shadow:
                0 0 7px #9999ff,
                0 0 15px #5c5cff,
                0 0 25px #5c5cff,
                0 0 35px #0000ff;
        }

        #video-fondo {
            /** Posicionamiento **/
            position: fixed;
            /* Fija el video a la ventana */
            top: 0;
            left: 0;

            /** Dimensiones **/
            width: 100vw;
            /* 100% del ancho de la ventana */
            height: 100vh;
            /* 100% del alto de la ventana */

            /** Asegura que cubra todo, incluso si se recorta **/
            object-fit: cover;

            /** Pone el video detrás de otro contenido **/
            z-index: -1;
        }
    </style>
