<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown NYE</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            padding: 0;
            margin: 0;
            text-decoration: none;
            list-style: none;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            margin: 0;
            padding: 0;
        }

        h1 {
            color: #fff;
        }

        main {
            padding: 5px;
            text-align: center;
        }

        @font-face {
            font-family: 'NYE Font';
            src: url('../font/Shentox-Bold.ttf') format('truetype');
        }

        #countdown {
            display: inline;
            text-align: center;
            margin-top: 20px;
        }

        #timer {
            text-align: center;
            position: absolute;
            top: 50%;
            right: 50%;
            transform: translate(50%, -50%);
            font-family: 'NYE Font', sans-serif;
            font-size: 160px;
            font-weight: bold;
            font-style: normal;
            color: #fff;
            text-shadow: 2px 2px 4px rgb(0, 0, 0);
        }
    </style>
</head>

<body>
    <main>
        <section class="countdown">
            <div id="timer">
                <span hidden="true" id="days3">00</span>
                <span hidden="true">:</span>
                <span id="hours3">00</span>
                <span>:</span>
                <span id="minutes3">00</span>
                <span>:</span>
                <span id="seconds3">00</span>
            </div>
        </section>

    </main>

    <script src="js/countdown3.js"></script>

</body>

</html>
