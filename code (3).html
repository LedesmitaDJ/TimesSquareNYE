<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Ejemplo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            /* Color de fondo de respaldo */
            background-color: #333; /* Cambia este color según prefieras */
        }

        /* Video de fondo */
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Imagen de fondo de respaldo (se muestra si el video no carga) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://via.placeholder.com/1920x1080?text=Imagen+de+Fondo'); /* Reemplaza con tu URL de imagen */
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        h1 {
            font-size: 3rem; /* Tamaño base, se ajusta en media queries */
            margin: 0;
        }

        p {
            font-size: 1.5rem; /* Tamaño base, se ajusta en media queries */
            margin: 0.5rem 0 0 0;
        }

        /* Estilo del botón */
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 1rem;
            background-color: #007bff; /* Color azul del botón */
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #0056b3; /* Color más oscuro al pasar el mouse */
        }

        /* Media queries para responsividad */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem; /* Reduce tamaño en tablets y móviles */
            }
            p {
                font-size: 1.2rem; /* Reduce tamaño en tablets y móviles */
            }
            .button {
                font-size: 1rem; /* Reduce tamaño del botón en tablets y móviles */
                padding: 8px 16px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem; /* Aún más pequeño en móviles pequeños */
            }
            p {
                font-size: 1rem; /* Aún más pequeño en móviles pequeños */
            }
            .button {
                font-size: 0.9rem; /* Aún más pequeño en móviles pequeños */
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Video de fondo con bucle -->
    <video id="background-video" autoplay loop muted>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4"> <!-- Reemplaza con tu URL de video -->
        Tu navegador no soporta el elemento de video.
    </video>

    <!-- Contenido centrado -->
    <h1>Título de la Página</h1>
    <p>Descripción breve de la página.</p>
    <a href="https://example.com" target="_blank" class="button">Visitar Sitio</a> <!-- Reemplaza con tu URL real -->
</body>
</html>
