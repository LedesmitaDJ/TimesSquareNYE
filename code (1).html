<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor con Playlist</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            text-align: center;
        }
        #player {
            width: 100%;
            max-width: 800px;
            height: 450px;
            margin: 0 auto 20px;
            border: none;
        }
        #playlist {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto;
        }
        .playlist-item {
            flex-shrink: 0;
            width: 150px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 5px;
            padding: 5px;
            transition: border-color 0.3s;
        }
        .playlist-item.selected {
            border-color: #007bff;
            background-color: #e9ecef;
        }
        .playlist-item img {
            width: 100%;
            height: 84px;
            object-fit: cover;
            border-radius: 3px;
        }
        .playlist-item p {
            margin: 5px 0 0;
            font-size: 12px;
            font-weight: bold;
        }
        /* Responsive design */
        @media (max-width: 768px) {
            #player {
                height: 250px; /* Altura reducida en móviles */
                max-width: 100%;
            }
            #playlist {
                gap: 5px;
                padding: 5px;
            }
            .playlist-item {
                width: 120px; /* Miniaturas más pequeñas */
            }
            .playlist-item img {
                height: 67px; /* Ajuste proporcional */
            }
            .playlist-item p {
                font-size: 10px;
            }
        }
        @media (max-width: 480px) {
            #player {
                height: 200px;
            }
            .playlist-item {
                width: 100px;
            }
            .playlist-item img {
                height: 56px;
            }
        }
    </style>
</head>
<body>
    <h1>Reproductor con Playlist</h1>
    <p>Haz doble clic en un elemento de la playlist para editar su título y miniatura.</p>
    <iframe id="player" src="" allowfullscreen></iframe>
    <div id="playlist"></div>

    <script>
        // Array de playlist: type ("youtube" o "twitch"), id (video ID o canal), title, thumbnail
        let playlist = [
            {
                type: "youtube",
                id: "dQw4w9WgXcQ", // Ejemplo: Video de YouTube (Rick Roll)
                title: "Rick Astley - Never Gonna Give You Up",
                thumbnail: "https://img.youtube.com/vi/dQw4w9WgXcQ/0.jpg"
            },
            {
                type: "twitch",
                id: "ninja", // Ejemplo: Canal de Twitch
                title: "Ninja Stream",
                thumbnail: "https://static-cdn.jtvnw.net/previews-ttv/live_user_ninja-320x180.jpg"
            },
            {
                type: "youtube",
                id: "9bZkp7q19f0", // Otro video de YouTube
                title: "PSY - GANGNAM STYLE",
                thumbnail: "https://img.youtube.com/vi/9bZkp7q19f0/0.jpg"
            },
            {
                type: "twitch",
                id: "pokimane", // Otro canal de Twitch
                title: "Pokimane Stream",
                thumbnail: "https://static-cdn.jtvnw.net/previews-ttv/live_user_pokimane-320x180.jpg"
            },
            // Nuevos añadidos
            {
                type: "youtube",
                id: "kJQP7kiw5Fk", // Despacito
                title: "Luis Fonsi - Despacito ft. Daddy Yankee",
                thumbnail: "https://img.youtube.com/vi/kJQP7kiw5Fk/0.jpg"
            },
            {
                type: "twitch",
                id: "shroud", // Shroud
                title: "Shroud Stream",
                thumbnail: "https://static-cdn.jtvnw.net/previews-ttv/live_user_shroud-320x180.jpg"
            },
            {
                type: "youtube",
                id: "hQAHSlTtcmY", // Tutorial de JavaScript
                title: "JavaScript Tutorial for Beginners",
                thumbnail: "https://img.youtube.com/vi/hQAHSlTtcmY/0.jpg"
            },
            {
                type: "twitch",
                id: "xqcow", // xQc
                title: "xQc Stream",
                thumbnail: "https://static-cdn.jtvnw.net/previews-ttv/live_user_xqcow-320x180.jpg"
            },
            {
                type: "youtube",
                id: "JGwWNGJdvx8", // Ed Sheeran - Shape of You
                title: "Ed Sheeran - Shape of You",
                thumbnail: "https://img.youtube.com/vi/JGwWNGJdvx8/0.jpg"
            },
            {
                type: "twitch",
                id: "summit1g", // Summit1g
                title: "Summit1g Stream",
                thumbnail: "https://static-cdn.jtvnw.net/previews-ttv/live_user_summit1g-320x180.jpg"
            }
        ];

        // Cargar playlist desde localStorage si existe
        const savedPlaylist = localStorage.getItem('playlist');
        if (savedPlaylist) {
            playlist = JSON.parse(savedPlaylist);
        }

        const player = document.getElementById('player');
        const playlistContainer = document.getElementById('playlist');
        let currentIndex = 0;

        // Función para cargar un video/transmisión
        function loadVideo(index) {
            const item = playlist[index];
            if (item.type === "youtube") {
                player.src = `https://www.youtube.com/embed/${item.id}?autoplay=1`;
            } else if (item.type === "twitch") {
                player.src = `https://player.twitch.tv/?channel=${item.id}&parent=localhost`; // Cambia "localhost" por tu dominio si lo subes
            }
            // Resaltar el seleccionado
            document.querySelectorAll('.playlist-item').forEach((el, i) => {
                el.classList.toggle('selected', i === index);
            });
            currentIndex = index;
        }

        // Función para editar un elemento (doble clic)
        function editItem(index) {
            const item = playlist[index];
            const newTitle = prompt("Editar título:", item.title);
            const newThumbnail = prompt("Editar URL de miniatura:", item.thumbnail);
            if (newTitle !== null && newThumbnail !== null) {
                playlist[index].title = newTitle;
                playlist[index].thumbnail = newThumbnail;
                localStorage.setItem('playlist', JSON.stringify(playlist)); // Guardar cambios
                renderPlaylist(); // Re-renderizar la playlist
            }
        }

        // Función para renderizar la playlist
        function renderPlaylist() {
            playlistContainer.innerHTML = ''; // Limpiar
            playlist.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'playlist-item';
                if (index === currentIndex) div.classList.add('selected');
                div.innerHTML = `
                    <img src="${item.thumbnail}" alt="${item.title}">
                    <p>${item.title}</p>
                `;
                div.addEventListener('click', () => loadVideo(index));
                div.addEventListener('dblclick', () => editItem(index)); // Doble clic para editar
                playlistContainer.appendChild(div);
            });
        }

        // Renderizar playlist inicial
        renderPlaylist();

        // Cargar el primer video por defecto
        loadVideo(0);
    </script>
</body>
</html>
